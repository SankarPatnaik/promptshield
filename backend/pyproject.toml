[project]
name = "promptshield-backend"
version = "0.1.0"
description = "PromptShield backend (FastAPI) - local prompt validation + security scoring"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.1",
]

[tool.uvicorn]
factory = false
